[package]
name = "swaptora-contract-sol"
version = "0.1.0"
edition = "2021"
description = "Immutable v1 addressed escrow for atomic Solana asset swaps"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "swaptora_contract_sol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["derive"] }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["associated_token", "metadata", "token", "token_2022"] }
solana-keccak-hasher = "3"

[dev-dependencies]
mollusk-svm = "=0.14.0"
mollusk-svm-programs-token = { version = "=0.14.0", default-features = false, features = ["associated-token", "token"] }
solana-account = "4.4"
solana-instruction = "3.5"
solana-program-option = "3.1"
solana-program-pack = "3.1"
solana-pubkey = "4.3"
solana-rent = "4.4"
solana-system-interface = { version = "3.3", features = ["bincode"] }
spl-token-interface = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }
